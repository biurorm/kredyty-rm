<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#094d47">
  <title>Kredyty, RM Nieruchomości</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<div class="app">

  <header>
    <div class="header-left">
      <img src="logo.png" alt="RM Nieruchomości" class="header-logo">
      <div class="subtitle">Kredyty</div>
    </div>
    <div class="header-right">
      <span class="wersja" data-wersja title="Wersja aplikacji"></span>
      <button class="icon-btn small-txt" id="btn-wyloguj" hidden>Wyloguj</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <!-- LOGOWANIE -->
  <section class="screen" id="ekran-logowanie" hidden>
    <div class="card">
      <div class="card-title">Zaloguj się</div>
      <p class="muted">Ten sam e-mail i hasło co w aplikacji Zadania RM.</p>
      <form id="form-logowanie">
        <label>E-mail <input type="email" id="log-email" autocomplete="username" autocapitalize="off" required></label>
        <label>Hasło <input type="password" id="log-haslo" autocomplete="current-password" required></label>
        <button class="btn btn-main" type="submit">Zaloguj</button>
        <div class="err" id="log-blad"></div>
      </form>
    </div>
  </section>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="klienci" class="on">🤝 Klienci <span class="tab-ile" id="tab-ile"></span></button>
    <button data-tab="zakonczone">✅ Zakończone</button>
    <button data-tab="kampanie">📣 Kampanie</button>
  </nav>

  <!-- KLIENCI DLA NATALII OD RM -->
  <section class="screen" id="ekran-klienci" hidden>
    <div class="chips doradcy" id="doradcy"></div>
    <div id="klienci-kafle"></div>
    <div class="grid2 raporty" id="btn-raport"></div>
    <input type="search" id="szukaj" class="szukaj" placeholder="Szukaj w toku: klient, nieruchomość" autocomplete="off">
    <div class="chips" id="klienci-filtry"></div>
    <div id="klienci-lista"></div>
    <button class="fab" id="fab-klient" aria-label="Nowy klient">＋</button>
  </section>

  <!-- ZAKOŃCZONE: podział na miesiące -->
  <section class="screen" id="ekran-zakonczone" hidden>
    <div class="chips doradcy" id="doradcy-z"></div>
    <div class="chips" id="lata-z"></div>
    <div id="zak-kafle"></div>
    <div class="card" id="zak-tabela"></div>
    <div id="zak-lista"></div>
  </section>

  <!-- KAMPANIE REKLAMOWE NA KREDYT -->
  <section class="screen" id="ekran-kampanie" hidden>
    <div class="info">Gdzie reklamujemy kredyty: miejsce, zdjęcie reklamy, termin, budżet i ile przyszło zapytań.</div>
    <div class="chips" id="kampanie-filtry"></div>
    <div id="kampanie-lista"></div>
    <button class="fab" id="fab-kampania" aria-label="Nowa kampania">＋</button>
  </section>

  <!-- KARTA (wysuwana od dołu) -->
  <div class="tlo" id="tlo" hidden></div>
  <div class="arkusz" id="arkusz" hidden role="dialog" aria-modal="true" aria-labelledby="ark-tytul">
    <div class="arkusz-uchwyt"></div>
    <div class="row-between">
      <div class="ark-nr" id="ark-nr"></div>
      <button class="icon-btn dark" id="ark-zamknij" aria-label="Zamknij">✕</button>
    </div>
    <div id="ark-tresc"></div>
  </div>

  <!-- PODGLĄD ZDJĘCIA -->
  <div class="podglad" id="podglad" hidden><img alt="Zdjęcie kampanii"></div>

  <input type="file" id="plik-zdjecie" accept="image/*" multiple hidden>
  <div class="toast" id="toast" hidden></div>
</div>
<div id="druk"></div>

<script src="config.js?v=2"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js?v=11"></script>
</body>
</html>
